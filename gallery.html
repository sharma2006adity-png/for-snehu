<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
overflow:hidden;
}

#slide{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
animation:zoom 8s linear infinite;
}

@keyframes zoom{
0%{transform:scale(1);}
100%{transform:scale(1.12);}
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
}

.quote{
position:absolute;
bottom:80px;
width:100%;
text-align:center;
color:white;
font-size:30px;
font-weight:bold;
padding:0 20px;
text-shadow:0 0 15px black;
animation:fade 1s;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}
.fadeOut{
opacity:0;
transition:.8s;
}

.fadeIn{
opacity:1;
transition:.8s;
}

#quote{
transition:.8s;
}

#slide{
transition:1s;
}
.heart{
position:absolute;
font-size:22px;
color:#ff4f87;
animation:float 7s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
#counter{
position:fixed;
top:20px;
right:20px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(10px);
padding:8px 18px;
border-radius:30px;
color:white;
font-size:18px;
font-weight:bold;
z-index:999;
}
  
audio{
display:none;
}
</style>
</head>

<body>

<img id="slide" src="images/1.jpg">

<div class="overlay"></div>
<div id="counter">1 / 10</div>
<div class="quote" id="quote">
Every beautiful friendship has a beginning... this is ours. 🤍
</div>

<audio autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

for(let i=0;i<35;i++){
let h=document.createElement("div");
h.innerHTML="❤️";
h.className="heart";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(4+Math.random()*5)+"s";
document.body.appendChild(h);
}

const photos=[
"images/1.jpg",
"images/2.jpg",
"images/3.jpg",
"images/4.jpg",
"images/5.jpg",
"images/6.jpg",
"images/7.jpg",
"images/8.jpg",
"images/9.jpg",
"images/10.jpg"
];

const quotes=[
"Every beautiful friendship has a beginning... this is ours. 🤍",
"A few moments... a lifetime of memories. ✨",
"Your smile has always made ordinary days feel special. 🌸",
"Some people become a habit... you became a beautiful memory. ❤️",
"Thank you for every laugh, every conversation and every moment. 😊",
"Distance may change many things, but not genuine friendships. 🌷",
"You're one of the few people I'm truly grateful to have met. 💖",
"Some bonds never need a reason... they simply matter. 🤍",
"Whatever happens in life, I'll always cherish these memories with you. 🌹",
"Happy Friendship Day, Snehu ❤️<br><small>With love, Aditya 😘</small>"
];
const slide = document.getElementById("slide");
const quote = document.getElementById("quote");
const counter = document.getElementById("counter");
let i=0;

function nextPhoto(){

i++;

if(i>=photos.length){

setTimeout(()=>{
window.location.href="letter.html";
},2500);

return;

}

slide.style.opacity="0";
quote.style.opacity="0";

setTimeout(()=>{

slide.src=photos[i];
quote.innerHTML=quotes[i];
counter.innerHTML=(i+1)+" / 10";
slide.style.opacity="1";
quote.style.opacity="1";

},700);

}

setInterval(nextPhoto,6000);

</script>

</body>
</html>

</script>

</body>
</html>
