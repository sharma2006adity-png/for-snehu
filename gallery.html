<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
overflow:hidden;
}

#slide{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
animation:zoom 8s linear infinite;
}

@keyframes zoom{
0%{transform:scale(1);}
100%{transform:scale(1.12);}
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
}

.quote{
position:absolute;
bottom:80px;
width:100%;
text-align:center;
color:white;
font-size:30px;
font-weight:bold;
padding:0 20px;
text-shadow:0 0 15px black;
animation:fade 1s;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.heart{
position:absolute;
font-size:22px;
color:#ff4f87;
animation:float 7s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

audio{
display:none;
}
</style>
</head>

<body>

<img id="slide" src="images/1.jpg">

<div class="overlay"></div>

<div class="quote" id="quote">
It all started with a simple hello... ❤️
</div>

<audio autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

for(let i=0;i<35;i++){
let h=document.createElement("div");
h.innerHTML="❤️";
h.className="heart";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(4+Math.random()*5)+"s";
document.body.appendChild(h);
}

const photos=[
"images/1.jpg",
"images/2.jpg",
"images/3.jpg",
"images/4.jpg",
"images/5.jpg",
"images/6.jpg",
"images/7.jpg",
"images/8.jpg",
"images/9.jpg",
"images/10.jpg"
];

const quotes=[
"It all started with a simple hello... ❤️",
"Little did I know you'd become so special. 🌸",
"Some smiles become memories forever. 😊",
"Every picture tells a beautiful story. ✨",
"You never had to try to be special. 💖",
"Thank you for every smile. 🤍",
"True friendship is rare. ❤️",
"Stay exactly the way you are. 🌷",
"You'll always be remembered. 🌹",
"Happy Friendship Day Bul Bul ❤️"
];

let i=0;

setInterval(()=>{

i++;

if(i>=photos.length){

location.href="letter.html";

return;

}

document.getElementById("slide").src=photos[i];
document.getElementById("quote").innerHTML=quotes[i];

},6000);

</script>

</body>
</html>
