<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOB Verification</title>

<style>

body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
overflow:hidden;
}

.card{
background:white;
padding:40px;
border-radius:20px;
text-align:center;
width:350px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
animation:pop .8s;
}

@keyframes pop{
from{transform:scale(.7);opacity:0;}
to{transform:scale(1);opacity:1;}
}

h1{
color:#ff2d75;
}

input{
width:100%;
padding:15px;
margin-top:20px;
border-radius:10px;
border:2px solid pink;
font-size:18px;
}

button{
margin-top:20px;
padding:14px 30px;
border:none;
border-radius:30px;
background:#ff2d75;
color:white;
font-size:18px;
cursor:pointer;
}

#msg{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<h1>🎂 One Small Task</h1>

<p>Select your Birthday ❤️</p>

<input type="date" id="dob">

<button onclick="check()">

Continue ❤️

</button>

<div id="msg"></div>

</div>

<script>

function check(){

let d=document.getElementById("dob").value;

if(d=="2004-01-05"){

document.getElementById("msg").innerHTML="Perfect Bul Bul ❤️";

setTimeout(function(){

location.href="friend.html";

},2000);

}

else{

document.getElementById("msg").innerHTML="Oops 😝 Wrong Birthday";

}

}

</script>

</body>
</html>
