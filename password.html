<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#111,#2b0b1b,#ff4f87);
overflow:hidden;
}

.card{
width:380px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(15px);
padding:35px;
border-radius:25px;
text-align:center;
color:white;
box-shadow:0 0 30px rgba(255,255,255,.15);
}

h1{
margin-bottom:15px;
}

p{
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:30px;
outline:none;
font-size:16px;
margin-bottom:20px;
text-align:center;
}

button{
padding:14px 35px;
border:none;
border-radius:30px;
background:#ff4f87;
color:white;
font-size:18px;
cursor:pointer;
}

#msg{
margin-top:18px;
font-size:18px;
font-weight:bold;
}

.heart{
position:absolute;
color:#ff6fa8;
font-size:20px;
animation:float 7s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-100vh);}
}
</style>

</head>

<body>

<div class="card">

<h1>🔐 Enter Password</h1>

<p>Only Snehu can unlock this ❤️</p>

<input id="pass" placeholder="Enter Password">

<button onclick="check()">
Unlock ❤️
</button>

<div id="msg"></div>

</div>

<script>

for(let i=0;i<40;i++){
let h=document.createElement("div");
h.innerHTML="❤️";
h.className="heart";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(4+Math.random()*5)+"s";
document.body.appendChild(h);
}

function check(){

let p=document.getElementById("pass").value;

if(p=="pyar se aditya 😘"){

document.getElementById("msg").innerHTML="Welcome Khala Tampoo ❤️";

setTimeout(function(){

location.href="dob.html";

},2500);

}else{

document.getElementById("msg").innerHTML="❌ Wrong Password Bul Bul 😝";

}

}

</script>

</body>
</html>
