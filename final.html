<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ffb6d5,#ffdce9,#fff);

}

.hearts{

position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;

}

.heart{

position:absolute;
bottom:-40px;
font-size:24px;
animation:fly 8s linear infinite;
opacity:.8;

}

@keyframes fly{

0%{

transform:translateY(0) scale(.6);
opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.2) rotate(360deg);
opacity:0;

}

}

.card{

width:92%;
max-width:760px;

background:white;

padding:50px;

border-radius:25px;

text-align:center;

box-shadow:0 20px 60px rgba(0,0,0,.18);

animation:pop 1s ease;

}

@keyframes pop{

from{

transform:scale(.6);
opacity:0;

}

to{

transform:scale(1);
opacity:1;

}

}

h1{

font-size:48px;
color:#ff4f87;
margin-bottom:25px;

}

#msg{

font-size:24px;
line-height:1.8;
color:#444;

}

.sign{

margin-top:35px;
font-size:22px;
color:#ff4f87;
font-weight:bold;

}

.footer{

margin-top:25px;
font-size:16px;
color:#888;

}

</style>

</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="card">

<h1>❤️ Happy Friendship Day ❤️</h1>

<div id="msg">

Thank you for being such a beautiful part of my life.<br><br>

No matter where life takes us,<br>
I'll always be grateful that our paths crossed.<br><br>

Keep smiling... 😊<br>
Keep shining... ✨<br>
Stay happy forever. 🌸

</div>

<div class="sign">

— Always cheering for you,<br>
Aditya 🤍

</div>

<div class="footer">

Made with lots of care ❤️

</div>

</div>

<script>
// Floating Hearts

const hearts = document.getElementById("hearts");

for(let i=0;i<50;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=Math.random()>0.5 ? "❤️" : "💖";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(5+Math.random()*5)+"s";

heart.style.animationDelay=(Math.random()*5)+"s";

heart.style.fontSize=(18+Math.random()*18)+"px";

hearts.appendChild(heart);

}

// Confetti

function createConfetti(){

const colors=["#ff4f87","#ffd700","#00c2ff","#8a2be2","#00c853"];

for(let i=0;i<120;i++){

let c=document.createElement("div");

c.style.position="fixed";

c.style.width="8px";

c.style.height="8px";

c.style.left=Math.random()*100+"vw";

c.style.top="-20px";

c.style.background=colors[Math.floor(Math.random()*colors.length)];

c.style.borderRadius="50%";

c.style.pointerEvents="none";

c.style.transition="transform 4s linear, opacity 4s linear";

document.body.appendChild(c);

setTimeout(()=>{

c.style.transform=`translateY(${window.innerHeight+100}px) rotate(720deg)`;

c.style.opacity="0";

},50);

setTimeout(()=>{

c.remove();

},4500);

}

}

createConfetti();

</script>

</body>
</html>
